name: Keep API awake

# Pings the health endpoint on a schedule so Render (and Neon) never sleep,
# which prevents cold-start timeouts ("that lookup was interrupted").
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          echo "Pinging health endpoint..."
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://oneinbox-testing.onrender.com/health
